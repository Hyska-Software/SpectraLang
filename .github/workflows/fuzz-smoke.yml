name: Fuzz Smoke

on:
  push:
    branches:
      - main
      - master
      - "ai/**"
  pull_request:
  workflow_dispatch:

jobs:
  fuzz-smoke:
    name: fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [parser, semantic, pipeline, lowering]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly
        # cargo-fuzz builds with `-Zsanitizer`, which requires nightly.
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            fuzz

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Build fuzz targets
        working-directory: fuzz
        run: cargo fuzz build -O --debug-assertions

      - name: Smoke-run ${{ matrix.target }} (60s)
        working-directory: fuzz
        # cargo fuzz run picks up fuzz/corpus/<target> automatically.
        # Any crash, hang, or OOM exits non-zero and fails the job.
        run: |
          mkdir -p "${{ github.workspace }}/artifacts"
          cargo fuzz run -O --debug-assertions ${{ matrix.target }} -- \
            -max_total_time=60 \
            -max_len=16384 \
            -rss_limit_mb=2560 \
            -print_final_stats=1 \
            "-artifact_prefix=${{ github.workspace }}/artifacts/"

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: ignore
