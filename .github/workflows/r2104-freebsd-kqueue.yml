name: Required FreeBSD kqueue reactor

on:
  push:
    branches:
      - main
      - master
      - "ai/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "runtime/**"
      - "packages/spectra-api/**"
      - "tests/validation/**"
      - "scripts/validate_r2104_reactor.py"
      - ".github/workflows/r2104-freebsd-kqueue.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "runtime/**"
      - "packages/spectra-api/**"
      - "tests/validation/**"
      - "scripts/validate_r2104_reactor.py"
      - ".github/workflows/r2104-freebsd-kqueue.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freebsd-kqueue:
    name: FreeBSD kqueue reactor and async I/O
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Execute native FreeBSD tests
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15"
          sync: rsync
          copyback: false
          prepare: |
            pkg install -y bash curl git
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          run: |
            set -eu
            . "$HOME/.cargo/env"
            freebsd-version
            rustc -Vv
            cargo test -q -p spectra-runtime reactor -- --nocapture
            cargo test -q -p spectra-runtime async_stdlib_host_calls_cover_fs_tcp_udp_channels_and_cancellation -- --nocapture
