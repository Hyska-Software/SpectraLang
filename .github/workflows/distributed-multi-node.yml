name: distributed-multi-node

# Real cross-network-namespace distributed training: the coordinator runs as a
# job step on the runner host bound to 0.0.0.0 (SPECTRA_DIST_BIND), while ONE
# service container (own Docker network namespace) runs the SAME compiled test
# binary in worker role, resolving the host via the `coordinator` hostname
# (--add-host=coordinator:host-gateway ⇒ the docker bridge gateway IP of the
# runner host). Traffic therefore traverses the docker bridge between two
# distinct network namespaces — unlike distributed-e2e.yml, which only
# exercises loopback multi-process on one host.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DIST_PORT: "47231"
  DIST_TOKEN: spectra-ci-dist-token-v1
  DIST_TEST: "stdlib::ml_distributed_tcp::dist_tcp_fault_tests::dist_tcp_multi_node_container_entrypoint"
  DIST_STAGE_DIR: /home/runner/work/_temp/spectra-dist-stage

jobs:
  dist-tcp-multi-node:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Worker container. GitHub Actions cannot set a service command, so the
      # entrypoint is an idle bash (-t keeps it alive); the job stages the
      # freshly built binary + driver script into the shared volume and then
      # launches the worker loop via `docker exec`.
      dist-worker:
        image: ubuntu:24.04
        options: >-
          -t
          --entrypoint /bin/bash
          --add-host=coordinator:host-gateway
          --name dist-worker-container
        volumes:
          # Docker creates the host directory if absent at container start;
          # the build step stages the binary + driver script there. Literal
          # path: service blocks cannot rely on the workflow env context.
          - /home/runner/work/_temp/spectra-dist-stage:/dist
        env:
          SPECTRA_DIST_ROLE: worker
          SPECTRA_DIST_HOST: coordinator
          SPECTRA_DIST_PORT: "47231"
          SPECTRA_DIST_TOKEN: spectra-ci-dist-token-v1

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime

      - name: Build lib test binary and stage worker payload into the container
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p spectra-runtime --lib --no-run
          TESTBIN=$(cargo test -p spectra-runtime --lib --no-run --message-format=json \
            | jq -r 'select(.executable != null) | .executable' | head -1)
          test -x "$TESTBIN" || { echo "test binary not found"; exit 1; }
          mkdir -p "${DIST_STAGE_DIR}"
          cp "$TESTBIN" "${DIST_STAGE_DIR}/dist-test-binary"
          chmod +x "${DIST_STAGE_DIR}/dist-test-binary"
          cat > "${DIST_STAGE_DIR}/run-worker.sh" <<'EOF'
          #!/usr/bin/env bash
          # Worker-side retry loop: attach to coordinator:<port> until one full
          # training session succeeds (the coordinator may still be starting).
          set -u
          BIN=/dist/dist-test-binary
          for _ in $(seq 1 120); do [ -f "$BIN" ] && break; sleep 1; done
          if [ ! -f "$BIN" ]; then echo "worker: test binary never staged"; exit 1; fi
          attempt=0
          until "$BIN" -- --exact "${DIST_TEST}" --nocapture; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 30 ]; then echo "worker: giving up after $attempt attempts"; exit 1; fi
            echo "worker: attempt $attempt failed; retrying in 2s"
            sleep 2
          done
          EOF
          chmod +x "${DIST_STAGE_DIR}/run-worker.sh"
          # Sanity: the container is up and can resolve `coordinator` to the
          # runner host's bridge-gateway address.
          docker ps --filter name=dist-worker-container --format '{{.Names}} {{.Status}}'
          docker exec dist-worker-container getent hosts coordinator


      # Single shell so the backgrounded worker can be `wait`ed reliably.
      - name: Run coordinator on 0.0.0.0 against containerized worker
        shell: bash
        run: |
          set -euo pipefail
          docker exec dist-worker-container \
            env DIST_TEST="${DIST_TEST}" \
            /bin/bash /dist/run-worker.sh > "${RUNNER_TEMP}/worker.log" 2>&1 &
          WORKER_PID=$!
          # Direct binary invocation needs `--` before libtest args, and
          # --exact requires the fully qualified test path.
          SPECTRA_DIST_ROLE=coordinator \
          SPECTRA_DIST_BIND=0.0.0.0 \
          SPECTRA_DIST_PORT="${DIST_PORT}" \
          SPECTRA_DIST_TOKEN="${DIST_TOKEN}" \
          "${DIST_STAGE_DIR}/dist-test-binary" -- --exact "${DIST_TEST}" --nocapture
          wait "$WORKER_PID"
          echo "── worker container log ──"
          cat "${RUNNER_TEMP}/worker.log"
