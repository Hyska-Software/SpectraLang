name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Workspace test gate: every crate, every target.  This is the gate that was
  # previously only reachable through the opt-in stability_release phase of the
  # local runner (and therefore never ran for pull requests).
  # ---------------------------------------------------------------------------
  rust-tests:
    name: cargo test --workspace
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Workspace tests
        run: cargo test --workspace --all-targets

  # ---------------------------------------------------------------------------
  # Execution coverage: compile-only checks cannot catch miscompiles, so every
  # language fixture declaring `main` is executed through the JIT pipeline in
  # CI.  The full JIT + AOT pass runs in the local runner and in the release
  # gate (see release.yml).
  # ---------------------------------------------------------------------------
  execution-coverage:
    name: fixture execution (JIT)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-cli-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cli-

      - name: Build CLI
        run: cargo build -p spectra-cli

      - name: Execute fixtures (JIT)
        run: python scripts/validate_execution_coverage.py --mode jit

  # ---------------------------------------------------------------------------
  # Corpus replay: the fuzz targets build without cargo-fuzz (their non-fuzzing
  # entry point replays corpus files), so deterministic corpus replay runs on
  # every change.  Long mutation-based fuzzing stays a scheduled/manual job.
  # ---------------------------------------------------------------------------
  fuzz-corpus-replay:
    name: fuzz corpus replay
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            fuzz/target/
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-

      - name: Replay committed corpora
        shell: bash
        run: |
          set -euo pipefail
          for target in parser semantic pipeline lowering codegen; do
            echo "== replay ${target}"
            cargo run --manifest-path fuzz/Cargo.toml --bin "${target}" -- "fuzz/corpus/${target}"
          done
