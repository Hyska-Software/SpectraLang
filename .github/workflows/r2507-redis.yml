name: R-2507 Redis driver

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/spectra-db/**"
      - "packages/spectra-api/src/db.rs"
      - "tests/validation/196_redis_driver.spectra"
      - "scripts/validate_r2507_redis.py"
      - ".github/workflows/r2507-redis.yml"
  push:
    paths:
      - "packages/spectra-db/**"
      - "packages/spectra-api/src/db.rs"
      - "tests/validation/196_redis_driver.spectra"
      - "scripts/validate_r2507_redis.py"
      - ".github/workflows/r2507-redis.yml"

jobs:
  redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build CLI
        run: cargo build -p spectra-cli
      - name: Validate R-2507 against Redis 7
        env:
          SPECTRA_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          python scripts/validate_r2507_redis.py \
            --binary target/debug/spectralang \
            --redis-url "$SPECTRA_REDIS_URL" \
            --fixture tests/validation/196_redis_driver.spectra \
            --report target/r2507-redis/report.json
      - name: Publish R-2507 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2507-redis
          path: target/r2507-redis/
      - name: Verify certifying report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("target/r2507-redis/report.json").read_text())
          assert report["schema"] == "spectralang.r2507_redis.v1"
          assert report["status"] == "passed"
          assert not report["failures"]
          assert report["security"]["secret_not_in_report"]
          PY
