name: distributed-ns

# Multi-network-namespace distributed training via Linux network namespaces:
# scripts/distributed_ns_cluster.sh creates two worker namespaces (worker0,
# worker1) wired to the root namespace through routed veth pairs, runs the
# coordinator role of the multi-process e2e test in the root ns bound to
# 0.0.0.0, and the SAME test binary's worker role inside each namespace dialing
# SPECTRA_DIST_COORDINATOR_ADDR=<root-side veth IP>. Unlike distributed-e2e.yml
# (single loopback host) and like distributed-multi-node.yml, traffic crosses
# real network boundaries — here proven with plain iproute2, no Docker.
# GitHub runners are sudo-enabled, which `ip netns add` requires.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DIST_LOG_DIR: /tmp/spectra-dist-ns-logs

jobs:
  dist-tcp-netns:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime

      - name: Coordinator + 2 worker network namespaces over routed veth
        shell: bash
        env:
          # The script writes coordinator/worker logs here so the artifact
          # step below can upload them even when the run fails.
          SPECTRA_NS_LOG_DIR: ${{ env.DIST_LOG_DIR }}
        run: |
          set -euo pipefail
          # Hard step-level bound on top of the script's own per-process
          # timeouts; runners are passwordless-sudo enabled.
          sudo --preserve-env=SPECTRA_NS_LOG_DIR \
            bash scripts/distributed_ns_cluster.sh

      - name: Upload namespace logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-ns-logs
          path: ${{ env.DIST_LOG_DIR }}
          if-no-files-found: ignore
