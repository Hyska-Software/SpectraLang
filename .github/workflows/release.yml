name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Versao a publicar (ex: 0.2.0 - sem o prefixo v)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release-preflight:
    name: Release Preflight
    runs-on: ubuntu-latest
    outputs:
      can_release: ${{ steps.signing.outputs.can_release }}

    steps:
      - name: Check release signing key
        id: signing
        env:
          SPECTRA_RELEASE_SIGNING_KEY: ${{ secrets.SPECTRA_RELEASE_SIGNING_KEY }}
        run: |
          if [ -n "${SPECTRA_RELEASE_SIGNING_KEY}" ]; then
            echo "can_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "can_release=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SPECTRA_RELEASE_SIGNING_KEY secret is required for production release signing." >&2
            exit 1
          fi

          echo "SPECTRA_RELEASE_SIGNING_KEY secret is not configured; skipping automatic production release."

  stability-required:
    name: Required stability certification
    needs: release-preflight
    if: needs.release-preflight.outputs.can_release == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spectra
          POSTGRES_PASSWORD: spectra
          POSTGRES_DB: spectra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U spectra -d spectra_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Build CLI
        run: cargo build -p spectra-cli

      - name: Run required stability aggregate
        env:
          SPECTRA_POSTGRES_URL: postgres://spectra:spectra@127.0.0.1:5432/spectra_test
          SPECTRA_REDIS_URL: redis://127.0.0.1:6379/0
          SPECTRA_TLS_EXTERNAL_URL: ${{ secrets.SPECTRA_TLS_EXTERNAL_URL }}
        run: |
          test -n "$SPECTRA_TLS_EXTERNAL_URL"
          python scripts/validate_stability_release.py \
            --required \
            --binary target/debug/spectralang \
            --report target/stability/release-report.json \
            --markdown target/stability/release-report.md

      - name: Verify certifying report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("target/stability/release-report.json").read_text())
          assert report["schema"] == "spectralang.stability.release.v1"
          assert report["required"] is True
          assert report["status"] == "passed"
          assert report["release_certifying"] is True
          assert not report["failures"]
          assert not report["skipped_environment"]
          PY

      - name: Publish required stability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spectralang-required-stability
          path: target/stability/

  # ---------------------------------------------------------------------------
  # Phase 0: Determine version (from input or Cargo.toml) and create git tag
  # ---------------------------------------------------------------------------
  determine-version:
    name: Determine Version & Create Tag
    needs: [release-preflight, stability-required]
    if: needs.release-preflight.outputs.can_release == 'true' && needs.stability-required.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve and bump version
        id: ver
        run: |
          python3 <<'PY'
          import os
          import re

          cargo_path = "tools/spectra-cli/Cargo.toml"
          target_version = os.environ.get("TARGET_VERSION", "")

          with open(cargo_path, "r", encoding="utf-8-sig") as f:
              lines = f.readlines()

          in_package = False
          current = None
          for line in lines:
              stripped = line.strip()
              if stripped == "[package]":
                  in_package = True
                  continue
              if in_package and stripped.startswith("["):
                  in_package = False
                  continue
              m = re.match(r'^version\s*=\s*"([^"]+)"', stripped)
              if in_package and m:
                  current = m.group(1)
                  break

          if not current:
              print(f"::error::Não foi possível ler a versão de {cargo_path}")
              raise SystemExit(1)

          if target_version:
              version = target_version
          else:
              major, minor, patch = current.split(".")
              version = f"{major}.{minor}.{int(patch) + 1}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"CURRENT={current}\n")
              f.write(f"VERSION={version}\n")

          print(f"Bumped: {current} -> {version}")
          PY
        env:
          TARGET_VERSION: ${{ inputs.version }}

      - name: Update version in Cargo.toml and package.json
        run: |
          python3 <<'PY'
          import os
          import re

          current = os.environ["CURRENT_VERSION"]
          version = os.environ["NEW_VERSION"]
          cargo_path = "tools/spectra-cli/Cargo.toml"
          pkg_path = "tools/vscode-extension/package.json"

          # --- Cargo.toml: altera APENAS a linha version dentro do bloco [package]
          # utf-8-sig tolera BOM se existir; gravamos sem BOM.
          with open(cargo_path, "r", encoding="utf-8-sig") as f:
              lines = f.readlines()

          in_package = False
          cargo_changed = False
          for i, line in enumerate(lines):
              stripped = line.strip()
              if stripped == "[package]":
                  in_package = True
                  continue
              if in_package and stripped.startswith("["):
                  in_package = False
                  continue
              if in_package and re.match(r'^version\s*=\s*"' + re.escape(current) + r'"', stripped):
                  lines[i] = line.replace(f'version = "{current}"', f'version = "{version}"', 1)
                  cargo_changed = True
                  break

          if not cargo_changed:
              print(f"::error::Não encontrou version = '{current}' no bloco [package] de {cargo_path}")
              raise SystemExit(1)

          with open(cargo_path, "w", encoding="utf-8", newline="") as f:
              f.writelines(lines)

          # --- package.json: altera APENAS a primeira ocorrência de "version": "<current>"
          # Substituição textual literal preserva formatação, BOM e quebras de linha.
          with open(pkg_path, "r", encoding="utf-8-sig") as f:
              pkg_content = f.read()

          old_pkg = f'"version": "{current}"'
          new_pkg = f'"version": "{version}"'
          if old_pkg not in pkg_content:
              print(f"::error::Não encontrou '{old_pkg}' em {pkg_path}")
              raise SystemExit(1)

          pkg_content = pkg_content.replace(old_pkg, new_pkg, 1)

          with open(pkg_path, "w", encoding="utf-8", newline="") as f:
              f.write(pkg_content)

          print(f"Updated version to {version} in {cargo_path} and {pkg_path}")
          PY
        env:
          CURRENT_VERSION: ${{ steps.ver.outputs.CURRENT }}
          NEW_VERSION: ${{ steps.ver.outputs.VERSION }}

      - name: Commit and push version bump
        run: |
          VERSION="${{ steps.ver.outputs.VERSION }}"
          git add tools/spectra-cli/Cargo.toml tools/vscode-extension/package.json
          if git diff --staged --quiet; then
            echo "No version changes to commit (already at ${VERSION})."
          else
            git commit -m "chore: bump version to ${VERSION} [skip ci]"
            git push origin main
          fi

      - name: Create and push tag
        run: |
          TAG="v${{ steps.ver.outputs.VERSION }}"
          if git ls-remote --tags origin "${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists - skipping tag creation."
          else
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
            echo "Tag ${TAG} created and pushed."
          fi

  # ---------------------------------------------------------------------------
  # Phase 1: Build Rust binaries for all platforms
  # ---------------------------------------------------------------------------
  build-binaries:
    name: Build (${{ matrix.target }})
    needs: determine-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact-name: windows-x64
            ext: .exe

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact-name: linux-x64
            ext: ""

          - target: x86_64-apple-darwin
            os: macos-latest
            artifact-name: darwin-x64
            ext: ""

          - target: aarch64-apple-darwin
            os: macos-latest
            artifact-name: darwin-arm64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build spectralang
        run: cargo build --release --package spectra-cli --target ${{ matrix.target }}

      - name: Build spectra-lsp
        run: cargo build --release --package spectra-lsp --target ${{ matrix.target }}

      - name: Stage binaries
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/spectralang${{ matrix.ext }} staging/
          cp target/${{ matrix.target }}/release/spectra-lsp${{ matrix.ext }} staging/

      - name: Add spectralang to PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/target/${{ matrix.target }}/release" >> $GITHUB_PATH

      - name: Smoke test spectralang
        # Skip cross-compiled Apple Silicon binary when running on x64 runner and vice-versa
        if: matrix.artifact-name != 'darwin-x64'
        shell: bash
        run: spectralang --help || spectralang version || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.artifact-name }}
          path: staging/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Phase 2: VS Code Extension - universal VSIX (all binaries bundled)
  # ---------------------------------------------------------------------------
  build-vsix:
    name: Build VS Code Extension (Universal VSIX)
    needs: [build-binaries, determine-version]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: all-binaries/
          merge-multiple: false

      - name: Stage binaries inside the extension
        run: |
          EXT="tools/vscode-extension"
          mkdir -p \
            "${EXT}/server/win32-x64" \
            "${EXT}/server/linux-x64" \
            "${EXT}/server/darwin-x64" \
            "${EXT}/server/darwin-arm64"

          cp all-binaries/binaries-windows-x64/spectralang.exe  "${EXT}/server/win32-x64/"
          cp all-binaries/binaries-windows-x64/spectra-lsp.exe  "${EXT}/server/win32-x64/"

          cp all-binaries/binaries-linux-x64/spectralang   "${EXT}/server/linux-x64/"
          cp all-binaries/binaries-linux-x64/spectra-lsp   "${EXT}/server/linux-x64/"
          chmod +x "${EXT}/server/linux-x64/"*

          cp all-binaries/binaries-darwin-x64/spectralang  "${EXT}/server/darwin-x64/"
          cp all-binaries/binaries-darwin-x64/spectra-lsp  "${EXT}/server/darwin-x64/"
          chmod +x "${EXT}/server/darwin-x64/"*

          cp all-binaries/binaries-darwin-arm64/spectralang "${EXT}/server/darwin-arm64/"
          cp all-binaries/binaries-darwin-arm64/spectra-lsp "${EXT}/server/darwin-arm64/"
          chmod +x "${EXT}/server/darwin-arm64/"*

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tools/vscode-extension/package-lock.json

      - name: Install dependencies
        working-directory: tools/vscode-extension
        run: npm ci

      - name: Compile TypeScript
        working-directory: tools/vscode-extension
        run: npm run compile

      - name: Package VSIX
        working-directory: tools/vscode-extension
        run: |
          npx @vscode/vsce package \
            --no-git-tag-version \
            --out "spectra-vscode-extension-${{ needs.determine-version.outputs.version }}.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: tools/vscode-extension/spectra-vscode-extension-*.vsix
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Phase 3: Windows Installer via Inno Setup
  # ---------------------------------------------------------------------------
  package-windows:
    name: Windows Installer (Inno Setup)
    needs: [build-binaries, build-vsix, determine-version]
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-windows-x64
          path: installer/bin/

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix
          path: installer/vsix/

      - name: Stage VSIX for installer
        shell: bash
        run: |
          vsix=$(ls installer/vsix/spectra-vscode-extension-*.vsix | head -1)
          cp "${vsix}" installer/bin/spectra-vscode-extension.vsix

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile Inno Setup script
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ^
            /DAppVersion=${{ needs.determine-version.outputs.version }} ^
            /DSourceDir=bin ^
            installer\spectra.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: installer/Output/Spectra-Setup-*.exe
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Phase 4: Linux .deb package
  # ---------------------------------------------------------------------------
  package-linux-deb:
    name: Linux .deb Package
    needs: [build-binaries, build-vsix, determine-version]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-linux-x64
          path: installer/bin/

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix
          path: installer/vsix/

      - name: Stage VSIX for package
        run: |
          vsix=$(ls installer/vsix/spectra-vscode-extension-*.vsix | head -1)
          cp "${vsix}" installer/bin/spectra-vscode-extension.vsix

      - name: Build .deb package
        run: |
          chmod +x installer/build-deb.sh
          installer/build-deb.sh "${{ needs.determine-version.outputs.version }}" installer/bin

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-linux-deb
          path: installer/spectralang_*.deb
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Phase 5: Linux tarball (universal installer script)
  # ---------------------------------------------------------------------------
  package-linux-tarball:
    name: Linux Tarball (Universal)
    needs: [build-binaries, build-vsix, determine-version]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-linux-x64
          path: bin-linux-x64/

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix
          path: vsix-staging/

      - name: Create tarball
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          VSIX=$(ls vsix-staging/spectra-vscode-extension-*.vsix | head -1)
          dir="spectra-${VERSION}-linux-x64"

          mkdir -p "${dir}/bin" "${dir}/extension"
          cp "bin-linux-x64/spectralang" "${dir}/bin/"
          cp "bin-linux-x64/spectra-lsp" "${dir}/bin/"
          cp "${VSIX}" "${dir}/extension/spectra-vscode-extension.vsix"
          chmod +x "${dir}/bin/spectralang" "${dir}/bin/spectra-lsp"

          cp "installer/install-linux.sh" "${dir}/install.sh"
          chmod +x "${dir}/install.sh"

          tar -czf "spectra-${VERSION}-linux-x64.tar.gz" "${dir}"

      - name: Upload Linux tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-linux-tarball
          path: spectra-*-linux-x64.tar.gz
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Phase 6: macOS tarballs
  # ---------------------------------------------------------------------------
  package-macos:
    name: macOS Tarballs
    needs: [build-binaries, build-vsix, determine-version]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS x64 binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-darwin-x64
          path: bin-darwin-x64/

      - name: Download macOS ARM64 binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-darwin-arm64
          path: bin-darwin-arm64/

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix
          path: vsix-staging/

      - name: Create tarballs
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          VSIX=$(ls vsix-staging/spectra-vscode-extension-*.vsix | head -1)

          for arch in x64 arm64; do
            src="bin-darwin-${arch}"
            dir="spectra-${VERSION}-macos-${arch}"
            mkdir -p "${dir}/bin" "${dir}/extension"
            cp "${src}/spectralang" "${dir}/bin/"
            cp "${src}/spectra-lsp" "${dir}/bin/"
            cp "${VSIX}" "${dir}/extension/spectra-vscode-extension.vsix"
            chmod +x "${dir}/bin/spectralang" "${dir}/bin/spectra-lsp"

            cat > "${dir}/install.sh" <<'INSTALL'
          #!/usr/bin/env bash
          set -e
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          DEST="${HOME}/.local/bin"
          mkdir -p "$DEST"
          cp "${SCRIPT_DIR}/bin/spectralang" "$DEST/"
          cp "${SCRIPT_DIR}/bin/spectra-lsp" "$DEST/"
          chmod +x "$DEST/spectralang" "$DEST/spectra-lsp"
          echo "Spectra CLI and LSP installed to $DEST"
          echo "Make sure $DEST is in your PATH (add: export PATH=\"\$HOME/.local/bin:\$PATH\" to ~/.bashrc or ~/.zshrc)"
          VSIX_PATH="${SCRIPT_DIR}/extension/spectra-vscode-extension.vsix"
          if command -v code &>/dev/null; then
            echo "Installing VS Code extension..."
            code --install-extension "${VSIX_PATH}" --force && \
              echo "VS Code extension installed successfully." || \
              echo "Warning: could not install VS Code extension automatically."
            echo "You can install it manually: code --install-extension '${VSIX_PATH}'"
          elif command -v code-insiders &>/dev/null; then
            echo "Installing VS Code Insiders extension..."
            code-insiders --install-extension "${VSIX_PATH}" --force || true
          else
            echo "VS Code not found. To install the extension manually:"
            echo "  code --install-extension '${VSIX_PATH}'"
          fi
          INSTALL
            chmod +x "${dir}/install.sh"

            tar -czf "spectra-${VERSION}-macos-${arch}.tar.gz" "${dir}"
          done

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-macos
          path: spectra-*-macos-*.tar.gz
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Phase 7: Create GitHub Release and upload all assets
  # ---------------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    needs:
      - package-windows
      - package-linux-deb
      - package-linux-tarball
      - package-macos
      - build-vsix
      - determine-version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: List release assets
        run: find release-assets/ -type f | sort

      - name: Generate release security evidence
        env:
          SPECTRA_RELEASE_SIGNING_KEY: ${{ secrets.SPECTRA_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "${SPECTRA_RELEASE_SIGNING_KEY}" ]; then
            echo "SPECTRA_RELEASE_SIGNING_KEY secret is required for production release signing." >&2
            exit 1
          fi
          python scripts/release_security.py create \
            --artifact release-assets \
            --out release-evidence \
            --version "${{ needs.determine-version.outputs.version }}"
          python scripts/release_security.py verify --evidence release-evidence

      - name: Upload release security evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-security-evidence-${{ needs.determine-version.outputs.version }}
          path: release-evidence/
          retention-days: 30

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ needs.determine-version.outputs.version }}"
          mapfile -t files < <(find release-assets/ -type f | sort)
          if gh release view "${TAG}" &>/dev/null; then
            echo "Release ${TAG} already exists - uploading/replacing assets."
            gh release upload "${TAG}" "${files[@]}" --clobber
          else
            gh release create "${TAG}" \
              --title "SpectraLang ${TAG}" \
              --generate-notes \
              "${files[@]}"
          fi
