name: Fuzz Nightly

on:
  schedule:
    # Nightly at 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  fuzz-nightly:
    name: fuzz nightly (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [parser, semantic, pipeline, lowering]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly
        # cargo-fuzz builds with `-Zsanitizer`, which requires nightly.
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            fuzz

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Build fuzz targets
        working-directory: fuzz
        run: cargo fuzz build -O --debug-assertions

      - name: Nightly fuzz ${{ matrix.target }} (10 min)
        working-directory: fuzz
        # cargo fuzz run picks up fuzz/corpus/<target> automatically and
        # writes newly coverage-discovered inputs back into that directory,
        # so the corpus grows across the session.
        # Any crash, hang, or OOM exits non-zero and fails the job.
        run: |
          mkdir -p "${{ github.workspace }}/artifacts"
          cargo fuzz run -O --debug-assertions ${{ matrix.target }} -- \
            -max_total_time=600 \
            -max_len=16384 \
            -rss_limit_mb=2560 \
            -print_final_stats=1 \
            "-artifact_prefix=${{ github.workspace }}/artifacts/"

      - name: Minimize corpus
        if: always()
        working-directory: fuzz
        # Keep the uploaded corpus small by dropping redundant entries while
        # preserving every input that contributes unique coverage.
        run: cargo fuzz cmin -O ${{ matrix.target }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload updated corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 7

  merge-corpus:
    name: merge nightly corpus into repo
    needs: fuzz-nightly
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download corpus artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fuzz-corpus-*
          path: downloaded

      - name: Merge corpora (dedupe by content hash)
        run: |
          set -euo pipefail
          targets=(parser semantic pipeline lowering)
          total_added=0
          for target in "${targets[@]}"; do
            src="downloaded/fuzz-corpus-${target}"
            dest="fuzz/corpus/${target}"
            [ -d "$src" ] || { echo "::notice::no artifact for ${target}, skipping"; continue; }
            mkdir -p "$dest"
            added=0
            # Content-hash index of the committed corpus so identical inputs
            # are never duplicated across nightly runs.
            existing="$(find "$dest" -type f -print0 | xargs -0 -r sha256sum | cut -d' ' -f1)"
            queue="$(mktemp)"
            find "$src" -type f -print0 > "$queue"
            while IFS= read -r -d '' f; do
              hash="$(sha256sum "$f" | cut -d' ' -f1)"
              case "$existing" in *"$hash"*) continue ;; esac
              existing="${existing}"$'\n'"${hash}"
              out="$dest/$(basename "$f")"
              # Keep libFuzzer's hash-derived name; disambiguate collisions.
              if [[ -e "$out" ]]; then
                out="$dest/${hash:0:16}-$(basename "$f")"
              fi
              cp "$f" "$out"
              added=$((added + 1))
            done < "$queue"
            rm -f "$queue"
            echo "${target}: +${added} new inputs"
            total_added=$((total_added + added))
          done
          echo "TOTAL_ADDED=${total_added}" >> "$GITHUB_ENV"

      - name: Create corpus update PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: fuzz/corpus-update
          delete-branch: true
          title: "fuzz: refresh nightly corpus"
          commit-message: "fuzz: merge nightly corpus updates"
          body: |
            Automated nightly corpus refresh from the `Fuzz Nightly` workflow.

            New coverage-discovered inputs from all four targets were merged
            into `fuzz/corpus/<target>/`, deduplicated by SHA-256 content hash
            against the committed corpus.

            **Human review required:** skim the diff for oversized or
            sensitive inputs before approving; crash-derived regression seeds
            go through manual triage instead (see `fuzz/README.md`).
          labels: |
            fuzz
            corpus
