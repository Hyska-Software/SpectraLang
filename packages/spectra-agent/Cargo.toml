[package]
name = "spectra-agent"
version = "0.1.0"
edition = "2021"

# An rlib only: the namespace is aggregated by the existing `spectra-api`
# registration path, so this crate adds no staticlib, no C symbol, and no
# linker entry.
[lib]
crate-type = ["rlib"]

[dependencies]
# JSON crosses the host ABI for `AgentSpec`/`Report` (plan adaptation 11) and
# provider payloads; `serde_json` is already in the workspace graph through
# `spectra-runtime`, so this adds a direct edge, not a new crate.
serde_json = "1.0"
spectra-runtime = { path = "../../runtime" }
# The contract catalog is the single source of truth for the sink
# classification (R-3223 T2): the taint gate derives its sink set from
# `spectra_contract::catalog()` rather than from a list maintained here, so a
# namespace cannot drift out of the classification.
spectra-contract = { path = "../spectra-contract" }
