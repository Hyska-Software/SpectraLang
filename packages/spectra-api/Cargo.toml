[package]
name = "spectra-api"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = ["http3"]
http3 = ["dep:h3", "dep:h3-quinn", "dep:quinn"]

[dependencies]
async-graphql = { version = "7.2.1", default-features = false, features = ["dynamic-schema"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
brotli = "8"
flate2 = "1.1"
futures-util = "0.3"
h2 = "0.4"
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
http = "1"
mio = { version = "0.8", features = ["os-poll", "net"] }
prost = "0.13"
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "ring"], optional = true }
regex = "1.11"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
spectra-runtime = { path = "../../runtime" }
spectra-db = { path = "../spectra-db" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "0.26"

[dev-dependencies]
rcgen = "0.13"

[dev-dependencies.spectra-compiler]
path = "../../compiler"

[dev-dependencies.spectra-midend]
path = "../../midend"

[dev-dependencies.spectra-contract]
path = "../spectra-contract"
