  - id: R-3217
    title: "Journal, Replay, Approval and Tracing"
    owner: runtime
    priority: P0
    risk: high
    status: not_started
    dependencies: [R-3213, R-3211]
    wave: W4
    summary: "Every side effect recorded once, replayable without repeating effects, with human approval and OpenTelemetry GenAI spans."
    production_intent: "Durability is what makes an agent operable: a crash resumes instead of restarting, and a behavior can be reproduced instead of argued about."
    tasks:
      - id: R-3217-T1
        title: "Journal format and writer"
        files:
          - path: packages/spectra-agent/src/journal.rs
            action: create
        steps:
          - "Append-only records with run id, step sequence, kind, input digest, output digest, idempotency key, seed, usage and timestamp."
          - "Store digests rather than payloads by default; payload capture is opt-in and never captures credentials."
          - "Flush before returning from any effect-bearing call, so a crash cannot lose a completed effect."
        evidence:
          - "cargo test -p spectra-agent journal_append_and_read"
      - id: R-3217-T2
        title: "Replay algorithm"
        files:
          - path: packages/spectra-agent/src/replay.rs
            action: create
        steps:
          - "Replay reads the journal and returns recorded outputs for matching step keys instead of executing the effect."
          - "A step whose key is absent executes normally and appends, so partial journals resume forward."
          - "Idempotency keys are derived from run, step and input digest, so a retry after a crash collides instead of duplicating."
        evidence:
          - "cargo test -p spectra-agent replay_does_not_repeat_effects with a counting mock"
      - id: R-3217-T3
        title: "Human approval"
        files:
          - path: packages/spectra-agent/src/approval.rs
            action: create
        steps:
          - "approve(run, action) asks a registered approver; the default approver denies when no UI is attached."
          - "Decisions are journaled, so replay never asks twice."
          - "Approval records who decided and when, without storing sensitive context."
        evidence:
          - "cargo test -p spectra-agent approval_default_denies"
      - id: R-3217-T4
        title: "OpenTelemetry GenAI spans"
        files:
          - path: packages/spectra-agent/src/trace.rs
            action: create
          - path: packages/spectra-api/src/trace.rs
            action: reuse
        steps:
          - "Spans: invoke_agent, plan, execute_tool, chat with model name; attributes gen_ai.agent.name, gen_ai.conversation.id."
          - "Content capture is opt-in and off by default."
          - "Pin the conventions version and record it on the span."
        evidence:
          - "cargo test -p spectra-agent span_mapping_conformance"
    acceptance:
      - "Killing the process mid-run and resuming completes the run without duplicating any effect, proven by a counting test server."
      - "A replayed run produces identical tool ordering and outputs."
      - "Approval decisions survive replay and are attributed."
      - "Spans validate against the pinned conventions version; content is absent unless opted in."
      - "scripts/validate_r3217_agent_journal.py passes and is registered in run_tests.ps1."
    validation: "python scripts/validate_r3217_agent_journal.py"

