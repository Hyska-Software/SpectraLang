schema: spectralang.agent-platform-roadmap.v1
version: 1
updated_at: "2026-09-11"
roadmap_phase: phase_32
roadmap_phase_name: "Agent Platform"
status_scale: [not_started, in_progress, blocked, complete]
priority_scale: [P0, P1, P2, P3]
risk_scale: [low, medium, high]

purpose: |
  Executable engineering roadmap for `std.agent`, the native agent-first surface of
  SpectraLang: model calls, tools, memory, capability governance, durability, evals and
  agent protocols. Every item reflects the code as it exists today and names the exact
  files to change. This file is the detailed specification; `roadmap/roadmap.toml` and
  `docs/roadmap-backlog.md` carry the same items in their canonical formats.

production_definition: |
  An item is complete only when the feature runs through the normal CLI path (JIT and
  `--emit-exe` where runtime behavior is involved), has checked-in validation evidence,
  is documented, and does not regress the existing stdlib contract gates. Partial work
  stays `in_progress` with the remaining criteria visible.

# ---------------------------------------------------------------------------
# CONTEXT — verified state of the repository at roadmap authoring time
# ---------------------------------------------------------------------------

context:

  verified_state:
    - claim: "Every external effect goes through a named host call"
      evidence: "runtime/src/ffi_host_registry.rs:226 (register_host_function), runtime/src/ffi_lifecycle.rs:280 (spectra_rt_host_invoke)"
    - claim: "The language has no FFI, no extern declaration and no subprocess"
      evidence: "compiler/src/token.rs:5 (Keyword enum); packages/spectra-api/src/bindings/http.spectra:50-52 states native declarations live in the compiler until package-level extern syntax exists"
    - claim: "The IR carries the host call name for every external effect"
      evidence: "midend/src/ir.rs:276-280 (InstructionKind::HostCall)"
    - claim: "Host calls are classified fast vs generic at compile time, and the fast path bypasses the registry"
      evidence: "runtime/src/abi.rs:439-501 (FastHostCall::ALL, 28 entries), runtime/src/abi.rs:624-629 (resolve_host_call), backend/src/codegen_instruction_host.rs:24"
    - claim: "Generic dispatch runs through four entrypoints with catch_unwind boundaries"
      evidence: "runtime/src/ffi_lifecycle.rs:280, :344, :311, :387; runtime/src/ffi_host_registry.rs:162-208"
    - claim: "SpectraHostCallContext has 5 fields and no run, capability, taint or error channel"
      evidence: "runtime/src/ffi_core.rs:327-340"
    - claim: "Host call failure is fatal: any non-zero status becomes spectra_rt_panic and exit 101"
      evidence: "backend/src/codegen_instruction_host.rs:615-653; runtime/src/panic.rs:63-68"
    - claim: "Only four host status codes exist"
      evidence: "runtime/src/ffi_core.rs:320-323"
    - claim: "Structured recoverable errors already exist as a value shape"
      evidence: "runtime/src/stdlib/error.rs:20-25 (6-word layout), runtime/src/stdlib/error.rs:52-81 (alloc_error), runtime/src/stdlib/fs.rs:50-83 (failure construction pattern)"
    - claim: "The only thread-local execution context is the tracing stack, with an explicit propagation helper"
      evidence: "runtime/src/tracing/mod.rs:197-200, :492-494"
    - claim: "Generic handle infrastructure is generational and already carries 109 kinds"
      evidence: "runtime/src/handles/mod.rs:13-124, :336-490"
    - claim: "Async, Task, Stream, reactor, cancellation and a worker pool exist and are used by std.api"
      evidence: "midend/src/lowering_async.rs:17-83, runtime/src/stdlib/registration.rs:865-955, runtime/src/reactor/mod.rs:550-553"
    - claim: "Embeddings, vector index, RAG and local generation already exist and are validated"
      evidence: "runtime/src/stdlib/registration.rs:802-806, :1028-1066; scripts/validate_r1803_rag_toolkit.py"
    - claim: "HTTP client with TLS, pooling and SSRF policy exists in the api package"
      evidence: "packages/spectra-api/src/client_core.rs:454, packages/spectra-api/src/lib.rs:23-58"
    - claim: "Compiler builtin tables are the source of truth; the contract catalog is generated from them"
      evidence: "compiler/src/bin/dump_stdlib_contract.rs:11-24, scripts/generate_stdlib_catalog.py:1-10"
    - claim: "Attributes on functions are parsed and stored but never validated"
      evidence: "compiler/src/ast/mod.rs:222, compiler/src/semantic/semantic_module_analysis.rs:253 (_ => {}), tools/spectra-cli/src/cli_package.rs:182-197"
    - claim: "Unknown attributes are rejected only on records and enums"
      evidence: "compiler/src/semantic/semantic_json.rs:57-64"
    - claim: "The JSON derive already produces to_json/from_json with field options"
      evidence: "compiler/src/semantic/semantic_json.rs:138, :244; midend/src/lowering_json_derive.rs:67-122; tests/validation/363_json_derive_exact_bytes.spectra"
    - claim: "A JSON snapshot of the builtin surface already exists"
      evidence: "compiler/src/semantic/builtin_contract.rs:15-19, :154-232; compiler/src/bin/dump_stdlib_contract.rs:11-24"
    - claim: "The project ModuleRegistry is not reachable after semantic analysis"
      evidence: "compiler/src/pipeline.rs:113-120, :134"
    - claim: "A direct-call graph already exists inside the inlining pass"
      evidence: "midend/src/passes/function_inlining.rs:33, :76-77"
    - claim: "JSON diagnostics carry severity, code, message, phase, hint, range and related only"
      evidence: "tools/spectra-cli/src/cli_diagnostics.rs:394-437"
    - claim: "One native package is linked today, through a single C symbol"
      evidence: "tools/spectra-cli/src/runtime_lib.rs:41, :69-72, :151-152; backend/src/aot.rs:764-775; packages/spectra-api/src/api_registration.rs:14"
    - claim: "Linking two staticlibs duplicates Rust symbols, so a second native package is not free"
      evidence: "tools/spectra-cli/src/linker.rs:288-289"
    - claim: "stdlib_contract.toml requires a probe per production namespace"
      evidence: "scripts/stdlib_contract.toml:51-192; scripts/validate_r3007_stdlib_contract.py:353-497, :572-716"
    - claim: "Four hand-maintained copies of the native surface are held together by tests"
      evidence: "packages/spectra-api/tests/contract_drift.rs:23-45, :75-110, :114-142, :166-215"
    - claim: "Highest existing roadmap id is R-3133 and highest phase is phase_31"
      evidence: "roadmap/roadmap.toml"
    - claim: "Highest validation fixture number is 363"
      evidence: "tests/validation/"

  hard_constraints:
    - "No second staticlib and no second C registration symbol in this workstream. `spectra.agent` ships as an rlib aggregated by the existing `spectra-api` registration path."
    - "No new attribute beyond `#[agent_tool]`. A second attribute means the design is wrong."
    - "No effect annotations. Effects are derived from the IR."
    - "No serde in `midend` or `backend`. JSON is assembled in the CLI, which already depends on serde_json."
    - "Capability policy lives only in the generic dispatch path. The fast path stays out of scope, guarded by an invariant test."
    - "Existing programs must keep working unchanged. Enforcement applies only while a run is active."
    - "Comments in English. Every item ships a `scripts/validate_r32NN_*.py` validator registered in `run_tests.ps1`."

  ownership_note: |
    Items are assigned to existing owner groups. The `web` group owns the model gateway
    and protocol adapters because they sit on `std.api`. A dedicated `agents` owner group
    can be introduced later, following the precedent of `web` and `db`, if this workstream
    grows beyond phase 32; introducing it now would require an AGENTS.md ownership change
    that is out of scope for this roadmap.

  decisions:
    - id: D1
      decision: "`spectra.agent` is an rlib crate `packages/spectra-agent`, depended on by `packages/spectra-api`, registered by the existing `spectra_api::register()`."
      rationale: "Each staticlib embeds spectra-runtime (tools/spectra-cli/src/linker.rs:288-289) and only one C symbol exists (packages/spectra-api/src/api_registration.rs:14). A second staticlib would require generalizing find_api_lib, is_api_archive_name, validate_api_required_symbols, link_executable_many, AotOptions and the AOT shim, with symbol duplication risk."
      consequence: "No change to linker.rs, runtime_lib.rs, aot.rs, compiler_integration_core.rs:548-549 or cli_bench.rs:3-4."
    - id: D2
      decision: "Capability enforcement applies to the generic dispatch path only."
      rationale: "The 28 FastHostCall entries are concurrent/string/map/tensor/ml operations with no external effect, and several return raw values rather than a status, so they cannot report denial."
      consequence: "An invariant test must fail if any fast host call ever falls under an effect-bearing namespace."
    - id: D3
      decision: "Policy is evaluated by a single extracted function `dispatch_generic(name, func_ptr, args, arg_len, results, result_len) -> i32`."
      rationale: "invoke_host_function receives only a function pointer (runtime/src/ffi_host_registry.rs:162-186); the cached path never consults the registry on a hit (runtime/src/ffi_host_registry.rs:78-101)."
      consequence: "Policy runs on cache hit and on every batch item."
    - id: D4
      decision: "Denial is `HOST_STATUS_DENIED` plus a dedicated runtime symbol for the fatal path, and `authorize()` for callers that want to handle it."
      rationale: "The lowering turns any non-zero status into a fatal trap (backend/src/codegen_instruction_host.rs:615-653) and there is no typed error channel; recoverable errors already work as values (runtime/src/stdlib/fs.rs:50-83)."
      consequence: "Two paths, one enforcement decision, no silent partial handling."
    - id: D5
      decision: "Active run is a stacking thread-local mirroring the tracing context, propagated explicitly to worker threads."
      rationale: "No ABI change to the repr(C) call context; precedent exists at runtime/src/tracing/mod.rs:197-200 and :492-494."
      consequence: "Detached work started inside a run requires its own capability, converting a propagation gap into a fail-closed default."
    - id: D6
      decision: "One new attribute: `#[agent_tool(\"description\")]`. JSON Schema comes from the existing Serialize derive."
      rationale: "Attributes on functions have no validation path today, so the first one is expensive and must be the last."
      consequence: "Tool name, input schema, effects and required capabilities are all derived."
    - id: D7
      decision: "`surface`, `impact`, `explain` and `docs` are CLI commands."
      rationale: "The midend and backend do not depend on serde; the ModuleRegistry is a private field of CompilationPipeline."
      consequence: "The compiler gains one accessor and one serializable snapshot; no new dependency anywhere."
    - id: D8
      decision: "The contract catalog gains the fields needed to generate the midend lowering tables and the Rust host-call table."
      rationale: "The catalog already carries effects, abi, error_model, maturity, owner, docs and fixture, and the generator already parses lowering sources with regex (scripts/validate_r3007_stdlib_contract.py:248-268)."
      consequence: "Migration must be extract, regenerate, diff-empty before the manual tables are deleted."

  invariants:
    - id: I1
      statement: "No host call that touches the outside world is in the fast path."
      pinned_by: "Completeness test next to runtime/src/abi.rs:666-678, asserting that no name in FastHostCall::ALL matches the effect namespaces (std.api.*, std.fs.*, std.agent.*)."
    - id: I2
      statement: "Every effect executed inside a run was authorized by that run's capability set."
      pinned_by: "Negative fixture: a tool attempting an effect absent from `allow` fails, including through the cached and batch dispatch paths."
    - id: I3
      statement: "No effect is executed twice across a journal replay."
      pinned_by: "Interrupt-and-resume fixture with a counting test server."
    - id: I4
      statement: "Adding a native function does not require editing the same surface in four places."
      pinned_by: "Generator `--check` modes failing on stale files plus contract_drift tests."
    - id: I5
      statement: "A program without an active run behaves exactly as before this workstream."
      pinned_by: "Existing validation suite unchanged plus a dedicated regression fixture."
    - id: I6
      statement: "Tool metadata exposed to a model is derived, never hand-declared, except the description string."
      pinned_by: "surface --json comparing derived fields against the compiler view of the same function."

  out_of_scope:
    - "Effect rows in the type system."
    - "`extern` native declarations in packages."
    - "Macros or a general attribute system beyond `#[agent_tool]`."
    - "Subprocess execution and MCP over stdio."
    - "Compiler changes that alter existing language semantics."
    - "A general agent framework API beyond the 13 functions of the surface."

# ---------------------------------------------------------------------------
# SEQUENCING
# ---------------------------------------------------------------------------

waves:
  - id: W0
    goal: "Decisions and surface legibility; nothing depends on the library design yet."
    items: [R-3201, R-3202, R-3203, R-3204, R-3205]
    parallel_safe: true
  - id: W1
    goal: "Single source of truth for the native surface, so every later module costs three edits instead of ten."
    items: [R-3206, R-3207, R-3208]
    parallel_safe: [R-3207, R-3208]
  - id: W2
    goal: "Namespace, crate and the first end-to-end function through all layers."
    items: [R-3209]
    parallel_safe: false
  - id: W3
    goal: "Core library surface."
    items: [R-3210, R-3211, R-3212]
    parallel_safe: true
  - id: W4
    goal: "Governance: run context, enforcement, policy vocabulary, budget, durability."
    items: [R-3213, R-3214, R-3215, R-3216, R-3217]
    parallel_safe: [R-3216, R-3217]
  - id: W5
    goal: "Interoperability, evaluation and production certification."
    items: [R-3218, R-3219, R-3220, R-3221]
    parallel_safe: [R-3218, R-3219, R-3220]

# ---------------------------------------------------------------------------
# ITEMS
# ---------------------------------------------------------------------------

items:

  # =========================== W0 — Surface ================================

  - id: R-3201
    title: "ADR and Invariants for Agent Governance"
    owner: runtime
    priority: P0
    risk: medium
    status: not_started
    dependencies: []
    wave: W0
    summary: "Fix the architecture before code: single dispatch hook, fast-path exclusion, denial channel, run context and catalog-driven surface."
    production_intent: "Prevent the two failure modes that would be expensive later: a policy that can be bypassed, and a surface that must be edited in four places."
    tasks:
      - id: R-3201-T1
        title: "Write ADR 0016: capability enforcement model"
        files:
          - path: docs/adr/0016-agent-capability-enforcement.md
            action: create
        steps:
          - "Record D2, D3, D4 and D5 with the exact dispatch entrypoints (ffi_lifecycle.rs:280, :311, :344, :387) and the extracted dispatch_generic signature."
          - "State the fast-path exclusion and its completeness test explicitly, including why fast calls cannot report denial."
          - "Define the denial contract: HOST_STATUS_DENIED, the runtime symbol, the structured message format, and the authorize() pre-check."
          - "Define semantics for nested runs and for detached work inside a run."
        evidence:
          - "docs/adr/0016-agent-capability-enforcement.md exists with Status: Accepted"
      - id: R-3201-T2
        title: "Write ADR 0017: agent surface ownership and catalog-driven generation"
        files:
          - path: docs/adr/0017-agent-surface-generation.md
            action: create
        steps:
          - "Record D1 (rlib aggregation, one staticlib, one C symbol) with the linker rationale."
          - "Record D8 and the three-step migration: extract, regenerate, diff-empty, then delete manual tables."
          - "List the catalog fields to be added: params, returns, ir_return, returns_value, rust_symbol, cfg_feature."
          - "Record that std.agent is a `std` package namespace owned by the `runtime` group, mirroring ADR 0011 for std.api."
        evidence:
          - "docs/adr/0017-agent-surface-generation.md exists with Status: Accepted"
      - id: R-3201-T3
        title: "Write ADR 0018: run, journal and evaluation contract"
        files:
          - path: docs/adr/0018-agent-run-contract.md
            action: create
        steps:
          - "Define Run as a handle (new HandleKind entries) with lifecycle, budget and journal identity."
          - "Define the journal record shape and the replay algorithm, including idempotency keys and approval caching."
          - "Define the span mapping to the OpenTelemetry GenAI conventions and pin the schema version."
          - "Define what an eval is allowed to assert versus what a deterministic test must cover."
        evidence:
          - "docs/adr/0018-agent-run-contract.md exists with Status: Accepted"
      - id: R-3201-T4
        title: "Land the fast-path invariant test"
        files:
          - path: runtime/src/abi.rs
            action: extend "add effect-namespace assertion near the existing completeness test at :666-678"
          - path: runtime/src/ffi_tests.rs
            action: extend "add the fixture that walks FastHostCall::ALL"
        steps:
          - "Classify every FastHostCall name against the effect namespace list; fail on any match."
          - "Fail if a new FastHostCall variant is added without classification (exhaustive match over FastHostCall)."
        evidence:
          - "cargo test -p spectra-runtime fast_host_call_effect_namespace"
    acceptance:
      - "Three ADRs exist, are Accepted, and each records rationale plus consequence."
      - "The fast-path invariant test exists and fails when a fast host call is temporarily reclassified into an effect namespace."
      - "scripts/validate_r3201_agent_platform_adr.py checks the ADRs, the invariant test, and the phase_32 registration in roadmap.toml."
    validation: "python scripts/validate_r3201_agent_platform_adr.py"
    integration: "Registered in run_tests.ps1; roadmap.toml phase_32 and items present."

  - id: R-3202
    title: "spectralang surface --json"
    owner: tooling
    priority: P0
    risk: medium
    status: not_started
    dependencies: [R-3201]
    wave: W0
    summary: "Emit the project and builtin public surface as machine-readable JSON with a token budget."
    production_intent: "A coding agent must answer 'what does this project expose' in one call instead of reading every file, and must be able to fit the answer into a context window."
    tasks:
      - id: R-3202-T1
        title: "Expose the project module registry"
        files:
          - path: compiler/src/pipeline.rs
            action: extend "add pub fn registry(&self) -> Arc<RwLock<ModuleRegistry>>; include the snapshot in CompilationResult at :113-120"
          - path: compiler/src/semantic/module_registry.rs
            action: reuse "ModuleExports, ExportedFunction, ExportedType, iter_modules"
        steps:
          - "Return the registry by Arc clone, not by move, so the pipeline stays reusable."
          - "Do not change analyze_module signatures; the CLI reads the registry after compilation."
        evidence:
          - "cargo test -p spectra-compiler"
      - id: R-3202-T2
        title: "Build the serializable surface snapshot"
        files:
          - path: compiler/src/semantic/surface.rs
            action: create "SurfaceSnapshot, SurfaceModule, SurfaceFunction, SurfaceType with serde::Serialize"
          - path: compiler/src/semantic/builtin_contract.rs
            action: reuse "BuiltinContractSymbol shape at :15-19 and builtin_contract_symbols at :154-232"
        steps:
          - "Mirror the existing builtin snapshot shape so `surface` is one format for stdlib and project alike."
          - "Include for each function: path, signature, module, effects (from the host call names reachable in the body), and required capabilities."
          - "Leave effects and capabilities nullable in this item; R-3214 and R-3215 fill them."
        evidence:
          - "cargo test -p spectra-compiler surface_snapshot"
      - id: R-3202-T3
        title: "Add the CLI command"
        files:
          - path: tools/spectra-cli/src/cli_surface.rs
            action: create
          - path: tools/spectra-cli/src/cli_parse_core.rs
            action: extend "dispatch arm near :103-113 and route in execute_action at :30"
          - path: tools/spectra-cli/src/cli_parse_options.rs
            action: extend "parser in the style of parse_release_info_invocation at :468-499"
          - path: tools/spectra-cli/src/main.rs
            action: extend "options struct, CliAction variant, include! at :252-263"
        steps:
          - "Flags: --json, --tokens N, --package NAME, --include-builtins."
          - "Trimming order under a token budget: drop doc fields, then non-exported types, then private members; never drop a type referenced by an included function."
          - "Exit codes follow the existing contract: 0 success, 65 compile failure, 64 usage, 74 IO."
        evidence:
          - "spectralang surface --json tests/projects/valid/integrated_api_platform"
      - id: R-3202-T4
        title: "Token-budget determinism"
        files:
          - path: tools/spectra-cli/src/cli_surface.rs
            action: extend
        steps:
          - "Ordering must be stable (module path, then symbol path) so two runs produce byte-identical output."
          - "Report the applied trim in a `trimmed` field so a caller can tell that the payload is partial."
        evidence:
          - "Two consecutive runs produce identical bytes; a fixture with --tokens forces trimming and reports it"
    acceptance:
      - "surface --json on a real project lists every public module, function and type with stable ordering."
      - "Output is byte-identical across runs; --tokens trims deterministically and reports what was trimmed."
      - "Unknown module or missing project root fails with exit 64/65 and a JSON diagnostic, not a panic."
      - "scripts/validate_r3202_surface_json.py passes and is registered in run_tests.ps1."
    validation: "python scripts/validate_r3202_surface_json.py"

  - id: R-3203
    title: "spectralang impact --json"
    owner: tooling
    priority: P1
    risk: medium
    status: not_started
    dependencies: [R-3201]
    wave: W0
    summary: "Answer 'what breaks if I change this symbol' from the call graph, not from text search."
    production_intent: "Impact analysis is the single most valuable signal for a coding agent editing an unfamiliar project, and text search systematically misses indirect callers."
    tasks:
      - id: R-3203-T1
        title: "Promote the call graph out of the inlining pass"
        files:
          - path: midend/src/passes/function_inlining.rs
            action: extract "collect_direct_calls at :33, :76-77 into a shared module"
          - path: midend/src/callgraph.rs
            action: create
            detail: 'public API: pub fn direct_calls(module: &IRModule) -> HashMap<String, HashSet<String>>'
        steps:
          - "Keep the existing pass behavior identical; the pass must call the shared function."
          - "Expose only the query the CLI needs; do not expose the pass internals."
        evidence:
          - "cargo test -p spectra-midend"
      - id: R-3203-T2
        title: "Reverse index: symbol to callers, fields to functions"
        files:
          - path: midend/src/callgraph.rs
            action: extend "reverse_callers, field_readers, field_writers"
        steps:
          - "Type members: map field access and struct literal construction to the functions that touch them."
          - "Record dynamic dispatch as a separate bucket rather than guessing targets."
        evidence:
          - "cargo test -p spectra-midend impact_reverse_index"
      - id: R-3203-T3
        title: "CLI command and output contract"
        files:
          - path: tools/spectra-cli/src/cli_impact.rs
            action: create
          - path: tools/spectra-cli/src/cli_parse_core.rs
            action: extend "dispatch and routing"
          - path: tools/spectra-cli/src/main.rs
            action: extend "options struct, CliAction variant, include!"
        steps:
          - "Accept a symbol path of the form Module::function or Type.field."
          - "Output fields: symbol, affected_functions, affected_types, affected_schemas, dynamic_dispatch, fixtures, eval_cases."
          - "fixtures come from the contract catalog; eval_cases from the eval directory when it exists."
        evidence:
          - "spectralang impact --json Cobranca.amount on a fixture project"
      - id: R-3203-T4
        title: "Honesty about coverage"
        files:
          - path: tools/spectra-cli/src/cli_impact.rs
            action: extend
        steps:
          - "When the graph cannot resolve a call (dyn dispatch, imported generic template), set dynamic_dispatch true and list the unresolved sites."
          - "Never report an empty affected list as complete when dynamic_dispatch is true."
        evidence:
          - "Fixture with a dyn call reports dynamic_dispatch true and names the site"
    acceptance:
      - "impact --json returns the full caller set for a changed function, including cross-module callers."
      - "Field-level impact returns the functions that read or construct the type."
      - "Unresolved dynamic sites are reported, not silently omitted."
      - "scripts/validate_r3203_impact_json.py passes and is registered in run_tests.ps1."
    validation: "python scripts/validate_r3203_impact_json.py"

  - id: R-3204
    title: "Diagnostics with Repair Information"
    owner: frontend
    priority: P1
    risk: medium
    status: not_started
    dependencies: []
    wave: W0
    summary: "Add expected, actual and fix to the JSON diagnostic contract and expose explain --json."
    production_intent: "Repair efficiency dominates one-shot generation quality in agent workflows; a diagnostic that states the fix removes an entire investigation round trip."
    tasks:
      - id: R-3204-T1
        title: "Extend the diagnostic data model"
        files:
          - path: compiler/src/error.rs
            action: extend "add expected, actual and fix to CompilerError with a builder that defaults to None"
          - path: tools/spectra-cli/src/cli_diagnostics.rs
            action: extend "JsonDiagnostic at :394-437 and span_error_to_json at :316-340"
        steps:
          - "All three fields are optional; absence must not change existing output shape for other codes."
          - "Keep SARIF output valid: map fix into a SARIF fix object only when present, otherwise emit no fixes array."
        evidence:
          - "cargo test -p spectra-cli diagnostics_tests"
      - id: R-3204-T2
        title: "Populate the five highest-value codes"
        files:
          - path: compiler/src/semantic
            action: extend "E0311 type mismatch, E033 unknown stdlib module, E028 self-import, E029 missing module, unsupported attribute"
        steps:
          - "For type mismatch: expected and actual are textual types; fix is a concrete suggestion among ?, if let, explicit cast."
          - "For unknown module: fix is the did-you-mean candidate already computed by the Levenshtein path."
          - "Do not attempt to populate every code in this item; the set grows by observed need."
        evidence:
          - "tests/validation fixtures for each of the five codes assert the fields in JSON"
      - id: R-3204-T3
        title: "explain --json"
        files:
          - path: tools/spectra-cli/src/cli_explain.rs
            action: create
          - path: tools/spectra-cli/src/cli_parse_core.rs
            action: extend "dispatch and routing"
          - path: tools/spectra-cli/src/main.rs
            action: extend "options struct, CliAction variant, include!"
        steps:
          - "Input: an error code. Output: description, common causes, fix patterns, and the documented reference entry."
          - "Source the descriptions from docs/diagnostics/error-code-reference.md so the CLI and docs cannot drift."
