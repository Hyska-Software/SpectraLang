  - id: R-3214
    title: "Capability Enforcement at the Dispatch Point"
    owner: runtime
    priority: P0
    risk: high
    status: not_started
    dependencies: [R-3213, R-3206]
    wave: W4
    summary: "One policy decision, applied at every generic dispatch entrypoint, with a dedicated denial path and no fast-path hole."
    production_intent: "This is the only capability in this roadmap that a competitor cannot match by adding a library: the language controls every effect, so the boundary can be total while a run is active."
    tasks:
      - id: R-3214-T1
        title: "Extract the single dispatch function"
        files:
          - path: runtime/src/ffi_host_registry.rs
            action: extend "add dispatch_generic(name, func_ptr, args, arg_len, results, result_len) -> i32 wrapping invoke_host_function at :162-186"
          - path: runtime/src/ffi_lifecycle.rs
            action: extend "route :280, :344, :311/:332 and :387/:413 through dispatch_generic"
        steps:
          - "Policy must run on cache hit: the cached path at :311 resolves without consulting the registry."
          - "Batch path: evaluate per item at :413 and return a status, never panic inside the outer catch_unwind at :397."
          - "The two non-cached entrypoints stay routed through the same function so a direct symbol call is not a hole."
        evidence:
          - "cargo test -p spectra-runtime dispatch_policy_all_entrypoints"
      - id: R-3214-T2
        title: "Denial channel"
        files:
          - path: runtime/src/ffi_core.rs
            action: extend "add HOST_STATUS_DENIED to the four existing codes at :320-323"
          - path: runtime/src/panic.rs
            action: extend "add a structured capability denial entry point beside spectra_rt_panic at :63-68"
          - path: runtime/src/abi.rs
            action: extend "register the new symbol in the RuntimeImport catalog at :70-119 and bump COUNT at :124"
          - path: backend/src/codegen_instruction_host.rs
            action: extend "branch on the new status at :615-653"
        steps:
          - "Denial message format: host call name, run goal, the capability that would have allowed it, and the allowed set."
          - "Never include secrets, payloads or headers in the denial message."
        evidence:
          - "cargo test -p spectra-backend denial_branch; fixture asserting exit 101 and the message shape"
      - id: R-3214-T3
        title: "Policy evaluation and authorize()"
        files:
          - path: packages/spectra-agent/src/policy.rs
            action: create "capability parsing, matching, scope predicates"
          - path: packages/spectra-agent/src/lib.rs
            action: extend "authorize(run, host) -> Result<bool, Error>"
        steps:
          - "Namespace match first; scoped predicate only where the host call registers an extractor (URL host, path prefix, table name)."
          - "Extractors are registered next to the host call, not inferred."
          - "authorize() lets an author handle denial gracefully; the dispatch decision remains the enforcement."
        evidence:
          - "cargo test -p spectra-agent policy_matching"
      - id: R-3214-T4
        title: "Effects and capabilities in the surface output"
        files:
          - path: compiler/src/semantic/surface.rs
            action: extend "fill effects and required capabilities from reachable host calls"
          - path: tools/spectra-cli/src/cli_surface.rs
            action: extend
        steps:
          - "Effects come from the IR, not from source annotations."
          - "A tool whose effects exceed the run's grant at startup fails at agent_start, not on the first call."
        evidence:
          - "spectralang surface --json emits effects and capabilities per tool"
    acceptance:
      - "A host call outside the grant fails, through all four generic entrypoints, including the cached and batch paths."
      - "The fast-path invariant test from R-3201 still passes and would fail if a fast call were effect-bearing."
      - "authorize() reports the same decision the dispatch enforces."
      - "Programs without an active run behave exactly as before."
      - "scripts/validate_r3214_capability_enforcement.py passes and is registered in run_tests.ps1."
    validation: "python scripts/validate_r3214_capability_enforcement.py"

  - id: R-3215
    title: "Capability Vocabulary Validated by the Compiler"
    owner: semantic
    priority: P0
