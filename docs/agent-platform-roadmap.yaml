# ---------------------------------------------------------------------------
# CROSS-CUTTING
# ---------------------------------------------------------------------------

cross_cutting:

  validation_convention:
    - "Each item ships scripts/validate_r32NN_<slug>.py in the style of the existing ~150 validators: require/fail helpers, roadmap registration check, fixture execution, and a JSON report under target/."
    - "Each validator is registered in run_tests.ps1; planning validators assert the roadmap block matches the expected phase, owner and status."
    - "Each runtime-facing item adds a fixture under tests/validation/ starting at 364, and each error-facing item adds a fixture under tests/errors/."
    - "Items touching the host-call surface add or extend a probe in scripts/stdlib_contract.toml."

  governance_touchpoints:
    - "roadmap/roadmap.toml: phase_32 plus one item per R-32NN with owner, priority, risk, dependencies, summary and acceptance."
    - "docs/roadmap-backlog.md: Phase 32 section with the same items in human-readable form."
    - "docs/production-ai-implementation-plan.md: agent platform vision chapter and phase summary."
    - "packages/spectra-api/tests/contract_drift.rs: extended for generated artifacts (R-3207, R-3208)."
    - "compiler/tests/snapshots/std_api_public_function_table.snap: updated whenever the public surface changes."
    - "scripts/stdlib_contract.toml: std.agent namespace, probe and any follow-up declarations."

  runtime_risk_register:
    - risk: "Policy bypass through the fast path"
      mitigation: "Invariant test from R-3201, plus fast calls cannot express denial by construction."
    - risk: "Run context lost across worker threads"
      mitigation: "Fail-closed default for detached work in R-3213."
    - risk: "ABI change breaking AOT silently"
      mitigation: "Every item touching runtime/src/abi.rs must run a real --emit-exe project, not only JIT."
    - risk: "Catalog migration breaking the contract auditor"
      mitigation: "Three-step migration with a diff-empty gate at each step in R-3207."
    - risk: "Attribute surface growing beyond one attribute"
      mitigation: "Recorded as a non-goal; a second attribute requires revising ADR 0017 first."
    - risk: "Durability implemented as best-effort writing"
      mitigation: "Flush-before-return and a crash test that kills the process mid-effect."
    - risk: "Eval suite flaky under model variance"
      mitigation: "Deterministic graders in CI; judge grading opt-in only."

  definition_of_done_for_the_workstream:
    - "Every R-32NN item is complete with its validator registered and passing."
    - "The fast-path invariant and capability enforcement tests exist and are enforced by CI."
    - "Adding a native function to std.agent costs the documented three edits, proven by a recorded before/after count."
    - "The integrated agent service project runs in JIT and AOT, survives interruption, and stays inside its budget."
    - "Documentation, examples and package publishing are complete, and the AI agent reference points to the new surface."
    - "The capability reference is generated from the catalog and cannot drift."
