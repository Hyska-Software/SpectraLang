[[follow_up]]
prefix = "std.tensor.diff"
owner = "ml"
roadmap = "R-3004"
reason = "Compiler-native reverse autodiff is tracked by the explicit R-3004 probe; runtime backward remains a public compatibility API while diff uses direct reverse-kernel steps."

[[probe]]
id = "compiler-native-autodiff"
path = "tests/validation/192_compiler_native_autodiff.spectra"
covers = ["std.tensor.diff", "std.tensor.backward", "std.tensor.grad", "std.ml.linear", "std.ml.mse_loss"]

