schema = "spectralang.r3007_stdlib_contract.v1"
contract_version = "r3007/v1"
binary_default = "target/debug/spectralang.exe"
catalog = "packages/spectra-contract/catalog/stdlib.toml"
catalog_policy = "derived-during-migration"
docs = [
  "docs/reference/05-stdlib.md",
  "docs/reference/06-referencia-rapida.md",
  "docs/runtime/standard-library.md",
  "docs/AI-AGENT-REFERENCE.md",
  "docs/language-feature-maturity.md",
  "docs/api/README.md",
  "docs/api/api-conformance-v0.md",
  "docs/api/std-api-http-types.md",
  "docs/api/std-api-json.md",
  "docs/api/std-api-cors.md",
  "docs/api/std-api-form.md",
  "docs/api/std-api-handler.md",
  "docs/api/std-api-middleware.md",
  "docs/api/std-api-multipart.md",
  "docs/api/std-ml-artifacts.md",
  "docs/api/std-ml-tokenization-embedding.md",
  "docs/api/std-api-query.md",
  "docs/api/std-api-routing.md",
  "docs/api/std-api-server-lifecycle.md",
  "docs/api/std-api-trace.md",
  "docs/api/std-api-sqlite.md",
  "docs/api/std-api-redis.md",
  "docs/api/std-api-health.md",
  "docs/api/std-api-session.md",
  "docs/api/std-api-websocket.md",
  "docs/api/std-api-sse.md",
  "docs/concurrency-serving.md",
]

[sources]
semantic = ["compiler/src/semantic/builtin_modules.rs"]
runtime = ["runtime/src/stdlib"]
api_runtime = ["packages/spectra-api/src"]
lowering = ["midend/src/lowering.rs"]
backend = ["backend/src/codegen.rs"]

[contract_defaults]
semantic_module = "compiler/src/semantic/builtin_modules.rs"
runtime_registration = "runtime/src/stdlib/mod.rs"
api_runtime_registration = "packages/spectra-api/src"
lowering = "midend/src/lowering.rs"
backend = "backend/src/codegen.rs"
documentation = "docs"

[[probe]]
id = "std-core"
path = "tests/validation/185_stdlib_contract_audit.spectra"
covers = ["std.io.*", "std.math.*", "std.string.*", "std.convert.*", "std.random.*", "std.collections.*", "std.fs.*", "std.compat.fs.*", "std.env.*", "std.compat.env.*", "std.option.*", "std.result.*", "std.error.*", "std.char.*", "std.time.*", "std.range.*"]

[[probe]]
id = "api-trace"
path = "tests/validation/193_opentelemetry_tracing.spectra"
covers = ["std.api.trace.*"]

[[probe]]
id = "api-sqlite-driver"
path = "tests/validation/194_sqlite_driver.spectra"
covers = ["std.api.db.sqlite.*"]

[[probe]]
id = "api-postgres-driver"
kind = "external"
command = ["python", "scripts/validate_r2505_postgres.py", "--binary", "target/debug/spectralang.exe", "--fixture", "tests/validation/195_postgres_driver.spectra", "--report", "target/r2505-postgres/r3007-probe-report.json"]
covers = ["std.api.db.postgres.*"]

[[probe]]
id = "api-redis-driver"
kind = "external"
command = ["python", "scripts/validate_r2507_redis.py", "--binary", "target/debug/spectralang.exe", "--fixture", "tests/validation/196_redis_driver.spectra", "--report", "target/r2507-redis/r3007-probe-report.json"]
covers = ["std.api.db.redis.*"]

