owner = "runtime"
classification = "incomplete"
roadmap = "R-3001"
reason = "Embedded 127.0.0.1-only HTTP/1.1 listener with POST /infer and GET /metrics dispatching to real dense/ONNX forward passes; sequential connections, no TLS/auth/back-pressure, and no API observability traces keep it below production."

[[namespace]]
prefix = "std.api.trace"
owner = "runtime"
classification = "production"
roadmap = "R-2701"
reason = "OTLP protobuf export, typed attributes, W3C propagation, bounded queue overflow, retries, timeouts, shutdown, concurrent HTTP isolation, filesystem spans, and real SQLite query spans are independently validated."

[[namespace]]
prefix = "std.api"
owner = "web"
classification = "production"
roadmap = "R-2220"
reason = "The std.api surface is covered by its dedicated API conformance validators; this audit verifies cross-source presence and probe coverage."

[[rule]]
prefix = "std.ml.distributed_"
classification = "incomplete"
roadmap = "R-3002"
reason = "Real per-worker forward/backward plus mean-ALLREDUCE over OS-thread and TCP-loopback transports with multi-process proofs; legacy single-process session hosts remain alongside, and GPU collectives, elastic membership, and rendezvous docs are outstanding."

[[rule]]
prefix = "std.ml.onnx_export"
classification = "baseline"
roadmap = "R-1801"
reason = "onnx_export emits a deterministic seeded fixture template, not a trained-model export; the deprecated-onnx-export lint steers callers to onnx_export_weights with live tensors."
[[rule]]
prefix = "std.ml.text_embed"
classification = "baseline"
roadmap = "R-3005"
reason = "text_embed currently produces deterministic hash embeddings rather than model-backed embeddings."

[[rule]]
prefix = "std.ml.tokenizer_wordpiece"
classification = "baseline"
roadmap = "R-3005"
reason = "tokenizer_wordpiece accepts an inline vocabulary and is retained only as a compatibility baseline."

[[rule]]
prefix = "std.ml.tokenizer_load"
classification = "production"
roadmap = "R-3005"
reason = "Loads and validates a versioned WordPiece vocabulary from the R-3003 artifact container."

[[rule]]
prefix = "std.ml.tokenizer_encode"
classification = "production"
roadmap = "R-3005"
reason = "Production tokenizer handles are created by tokenizer_load; the legacy inline constructor remains separately classified as baseline."

[[rule]]
prefix = "std.ml.tokenizer_decode"
classification = "production"
roadmap = "R-3005"
reason = "Production tokenizer handles provide deterministic special-token and invalid-ID behavior."

[[rule]]
prefix = "std.ml.embedding_load"
classification = "production"
roadmap = "R-3005"
reason = "Loads validated real embedding weights from the R-3003 artifact container without hash fallback."

[[rule]]
prefix = "std.ml.embedding_lookup"
classification = "production"
roadmap = "R-3005"
reason = "Performs lookup against a real validated embedding tensor handle."

[[rule]]
prefix = "std.ml.vector_index"
classification = "production"
roadmap = "R-3006"
reason = "Uses deterministic HNSW search and persists only through the versioned R-3003 Artifact Container v1 with checksums, metadata, atomic replacement, and CLI evidence."

[[rule]]
prefix = "std.ml.rag_evaluate_answer"
classification = "baseline"
roadmap = "R-3008"
reason = "Returns token-overlap F1 scaled to permille 0..1000 (answer_overlap_score semantics shared with ml.metrics_generation); model-graded judging is tracked as follow-up work."

[[rule]]
prefix = "std.tensor.device_available"
classification = "baseline"
roadmap = "R-1603"
reason = "Supported CPU/WGPU capability detection is real; reserved accelerator codes remain explicitly unsupported."

[[rule]]
prefix = "std.tensor.device_status"
classification = "baseline"
roadmap = "R-1603"
reason = "Capability status reports supported CPU/WGPU availability and rejects reserved devices."

[[rule]]
prefix = "std.tensor.to_device"
classification = "baseline"
roadmap = "R-1603"
reason = "Device transfer is real for CPU/WGPU only; other accelerator codes are unsupported by contract."

[[rule]]
prefix = "std.tensor.stats_"
classification = "baseline"
roadmap = "R-1603"
reason = "Metrics expose the current host-call tensor execution and optional accelerator fallback behavior."

[[rule]]
prefix = "std.api.trace."
classification = "production"
roadmap = "R-2701"
reason = "The R-2701 v2 collector gate independently validates OTLP payloads, typed attributes, W3C parentage, retries, permanent errors, connection drops, timeouts, bounded overflow, HTTP client propagation, concurrent isolation, filesystem spans, and SQLite spans."

[[rule]]
prefix = "std.api.db.sqlite."
classification = "production"
roadmap = "R-2504"
reason = "The v2 R-2504 gate independently validates bundled SQLite CRUD, typed statements, transactions, pool consumption, cancellation, non-blocking lock waits, and HTTP-parented OTLP query spans."

[[rule]]
prefix = "std.api.db.postgres."
classification = "incomplete"
roadmap = "R-2505"
reason = "PostgreSQL host calls include cancellable tasks, savepoints, COPY, and typed notifications, and a local PostgreSQL 16.14 v2 report passes; production classification waits for the checked-in CI lane to reproduce and publish that evidence."

[[rule]]
prefix = "std.api.db.redis."
classification = "incomplete"
roadmap = "R-2507"
reason = "Redis host calls use the real driver, but production classification waits for Redis 7 command, TTL, pub/sub, tracing, and independent CI evidence."

[[rule]]
prefix = "std.api.health."
classification = "production"
roadmap = "R-2510"
reason = "R-2510 validates startup controls and the reserved health routes through a real TCP server, including required-check recovery, timeout, SQLite SELECT 1, JSON validation and worker shutdown."
[[follow_up]]
