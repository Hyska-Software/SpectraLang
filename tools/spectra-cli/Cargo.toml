[package]
name = "spectra-cli"
version = "0.3.2"
edition = "2021"
build = "build.rs"

[features]
default = []
gpu = ["spectra-runtime/gpu"]

[[bin]]
name = "spectralang"
path = "src/main.rs"

[dependencies]
spectra-compiler = { path = "../../compiler" }
spectra-midend = { path = "../../midend" }
spectra-backend = { path = "../../backend" }
spectra-api = { path = "../../packages/spectra-api" }
spectra-db = { path = "../../packages/spectra-db" }
spectra-runtime = { path = "../../runtime" }
toml = "0.8"
toml_edit = "0.22"
diff = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[build-dependencies]
embed-resource = "2"
