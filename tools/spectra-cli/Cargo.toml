[package]
name = "spectra-cli"
version = "0.4.0"
edition = "2021"
build = "build.rs"
# Both bin targets share the implementation in `src/lib.rs`. `default-run`
# keeps `cargo run -p spectra-cli -- …` (documented in README/docs) on the
# canonical name now that the package has two binaries.
default-run = "spectralang"

[features]
default = []
gpu = ["spectra-runtime/gpu"]

[[bin]]
name = "spectralang"
path = "src/main.rs"

[[bin]]
name = "spc"
path = "src/bin/spc.rs"

[dependencies]
spectra-compiler = { path = "../../compiler" }
spectra-midend = { path = "../../midend" }
spectra-backend = { path = "../../backend" }
spectra-api = { path = "../../packages/spectra-api" }
spectra-agent = { path = "../../packages/spectra-agent" }
spectra-db = { path = "../../packages/spectra-db" }
spectra-runtime = { path = "../../runtime" }
toml = "0.8"
toml_edit = "0.22"
diff = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[build-dependencies]
embed-resource = "2"
