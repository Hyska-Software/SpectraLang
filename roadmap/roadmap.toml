[[items]]
id = "R-3126"
title = "Const String Data Section (promote string literals to .rodata / heap immutable)"
phase = "phase_31"
owner = "backend"
priority = "P0"
status = "complete"
risk = "low"
dependencies = ["R-3125"]
summary = "Closed the residual 0.7x gap of `word-count` (104.5M ns R-3125 -> 80M ns R-3126) to land at 2.06x vs Go — within the ≤ 2x target — by promoting string literals to global data sections instead of going through `manual_alloc` at runtime. The new `InstructionKind::ConstString { result, value }` IR variant replaces the 108+ IR instructions previously emitted per literal (Alloca + N×GEP + N×ConstInt + N×Store) with a single instruction. The JIT path allocates a `Box<[i64]>` (1 byte per i64 slot, matching the existing `*8` indexing in `emit_stack_string_char_at_inline`) and embeds the heap pointer as `iconst`. The AOT path declares a `.rodata` data section via `AotCodeGenerator::pre_intern_string_literals` (FNV-1a-based symbol name, Linkage::Local for linker dedup) and emits `global_value`. Dedup via `string_literal_data: HashMap<String, StringLiteralRecord>`. Total word-count speedup vs R-3124 baseline: 628M -> 80M = 7.85x."
acceptance = [
  "midend/src/ir.rs adds ConstString { result, value } variant to InstructionKind",
  "midend/src/builder.rs adds build_const_string helper that uses try_emit pattern",
  "midend/src/ir/pretty.rs formats ConstString as `<id> = const.string \"escaped\"`",
  "midend/src/passes/verification.rs handles ConstString in instruction_result (it produces a value) and instruction_operands (no operands)",
  "midend/src/lowering.rs lower_string_literal emits a single ConstString instead of Alloca + N×Store chain",
  "backend/src/codegen.rs adds StringLiteralRecord struct (ptr, len_with_null, data_id) and intern_string_literal helper that does heap-allocated JIT fallback (Box<[i64]>, one byte per i64 slot)",
  "backend/src/codegen.rs CodeGenerator adds string_literal_data HashMap + string_literal_storage Vec<Box<[i64]>> fields; generate_instruction handles ConstString by calling intern_string_literal and emitting either iconst (JIT) or global_value (AOT)",
  "backend/src/aot.rs AotCodeGenerator adds the same fields and pre_intern_string_literals method that scans all IR for ConstString and declares a .rodata data section per unique value",
  "backend/src/aot.rs create_string_literal_data uses FNV-1a hash for deterministic symbol names and Linkage::Local for dedup; data section content is i64 slots (one byte each, null-terminated)",
  "string_literal_lengths is populated automatically for every ConstString result with the alloc_len (including null terminator), so the R-3125 O(1) str.char_at / str.len fast paths activate without further changes",
  "All 62 cargo test -p spectra-runtime tests pass (no regressions)",
  "cargo build -p spectra-cli succeeds clean",
  "benchmarks/cross-lang/word-count/spectra/bench.spectra passes with rc=0 (correctness preserved through i64 slot layout change)",
  "word-count debug ns/iter drops from ~104,500,000 (R-3125) to ~80,000,000 (R-3126) — 1.31x additional speedup, gap vs Go drops to 2.06x (within ≤ 2x target)",
  "Total word-count speedup vs R-3124 baseline (628M ns): 7.85x",
  "string-reverse drops from ~70M to ~58M (1.21x additional speedup, gap vs Go 1.62x)",
