[[items]]
id = "R-109"
title = "Cross-Module String Value Handling"
phase = "phase_1"
owner = "backend"
priority = "P1"
status = "complete"
risk = "high"
dependencies = ["R-105"]
summary = "Fix cross-module string return value materialization and main-module string concatenation crashes surfaced by the multi-file test project suite."
acceptance = [
  "string values returned from a callee in another module (including stdlib modules) are materialized to the same runtime representation as in-module string returns",
  "`println` of a cross-module string return prints the actual string content, never a numeric pointer or garbage value",
  "`let s = \"a\" + \"b\";` followed by `println(s);` in the main module produces `ab` and does not crash, abort, or skip the subsequent `println`",
  "regression tests cover cross-module string return from a user module and from `std.string` (`concat`, `repeat_str`, `to_upper`, `to_lower`, `replace`, `reverse_str`, `trim`) plus main-module chained string literal concatenation",
  "no regression in existing in-module string concatenation, f-string interpolation, or `println` of string literals"
]

[[items]]
id = "R-110"
title = "Cross-Module Type and Method Resolution"
phase = "phase_1"
owner = "semantic"
priority = "P1"
status = "complete"
risk = "high"
dependencies = ["R-105"]
summary = "Resolve structs, enums, and their static/instance methods when the type is defined in another module, and accept struct fields of any type (including `string`) when the struct is constructed by a cross-module factory function."
acceptance = [
  "`Module::Type::method()` and `value.method()` on a type whose definition lives in an imported module resolve to the corresponding impl method",
  "the previously used workaround of cross-module factory functions returning the type still works; new code can use direct method dispatch on cross-module types",
  "structs with `string` fields produced by a cross-module factory compile and run without `Value N not found` IR errors or verifier failures",
  "regression tests cover method dispatch on cross-module struct, cross-module enum variant construction, and string-field struct construction across module boundaries",
  "diagnostics for genuinely missing methods on cross-module types report the type name, method name, and candidate impl blocks"
]

