[[items]]
id = "R-3119"
title = "Concurrent Task Slot Pool (eliminate `thread::spawn` per task)"
phase = "phase_31"
owner = "runtime"
priority = "P0"
status = "complete"
risk = "medium"
dependencies = ["R-3118"]
summary = "Replace the HashMap<JoinHandle> per task in `std_concurrent_task_spawn`/`_task_join` with a slot pool of `Arc<OnceLock<SpectraHostValue>>`. The current implementation spawns a real OS thread for every task_spawn call even when the work is trivial (the value is just an i64). On Windows that costs ~100µs per spawn+join; 10,000 tasks = ~1s of pure overhead. The slot pool keeps the public API identical but eliminates thread creation/destruction, dropping async-echo from 71x vs Go to ~5x."
acceptance = [
  "ConcurrentTask struct removed; ConcurrentRegistry now holds `Vec<Arc<OnceLock<SpectraHostValue>>>` + `Vec<usize>` free list + `next_fresh: usize`",
  "`std_concurrent_task_spawn` writes the value into a fresh or recycled slot via `OnceLock::set` and returns the slot index as task_id",
  "`std_concurrent_task_join` reads via `OnceLock::get`, replaces the slot with a fresh empty OnceLock, and pushes the index to the free list",
  "`std_concurrent_task_is_done` returns 1 whenever the slot has a value (always true for valid task_ids)",
  "`std_concurrent_reset` (`registry.clear()`) resets all slots, clears the free list, clears channels/counters, and resets `next_channel`/`next_counter` to 1",
  "`std_concurrent_pipeline_sum` is UNCHANGED — continues to use `thread::spawn` + `handle.join()` for real parallelism",
  "`stats_tasks_spawned` returns the same value as before (counter preserved across spawn/clear cycles)",
